<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener - Shorten Your Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Transform long URLs into short, shareable links</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Shortener Form -->
      <section class="shortener-section">
        <div class="form-card">
          <h2>Create Short Link</h2>
          
          <div class="form-group">
            <label for="longUrl">Enter your long URL:</label>
            <input 
              type="url" 
              id="longUrl" 
              placeholder="https://example.com/very/long/url" 
              required
            >
          </div>

          <div class="form-group">
            <label for="customCode">Custom short code (optional):</label>
            <input 
              type="text" 
              id="customCode" 
              placeholder="e.g., mylink (min 3 chars)" 
            >
          </div>

          <button id="shortenBtn" class="btn btn-primary">Shorten URL</button>

          <!-- Error/Success Messages -->
          <div id="messageContainer"></div>
        </div>
      </section>

      <!-- Result Card -->
      <section id="resultSection" class="result-section hidden">
        <div class="result-card">
          <h2>✨ Your Short URL is Ready!</h2>
          
          <div class="result-item">
            <label>Short URL:</label>
            <div class="copy-container">
              <input 
                type="text" 
                id="shortUrlInput" 
                readonly 
                class="result-input"
              >
              <button id="copyBtn" class="btn btn-secondary">Copy</button>
            </div>
          </div>

          <div class="result-item">
            <label>Original URL:</label>
            <input 
              type="text" 
              id="longUrlInput" 
              readonly 
              class="result-input"
            >
          </div>

          <div class="result-item">
            <label>Short Code:</label>
            <input 
              type="text" 
              id="shortCodeInput" 
              readonly 
              class="result-input"
            >
          </div>

          <div class="result-stats">
            <div class="stat">
              <span class="stat-label">Clicks:</span>
              <span id="clickCount" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Created:</span>
              <span id="createdTime" class="stat-value">-</span>
            </div>
          </div>

          <div class="button-group">
            <button id="viewStatsBtn" class="btn btn-secondary">View Full Stats</button>
            <button id="newUrlBtn" class="btn btn-primary">Create Another</button>
          </div>
        </div>
      </section>

      <!-- Recent URLs Section -->
      <section class="recent-section">
        <div class="recent-card">
          <h2>📋 Recent Short URLs</h2>
          <div id="urlsList" class="urls-list">
            <p class="loading">Loading recent URLs...</p>
          </div>
          <button id="refreshBtn" class="btn btn-secondary">Refresh List</button>
        </div>
      </section>
    </main>

    <!-- Stats Modal -->
    <div id="statsModal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <h2>📊 URL Statistics</h2>
        <div id="statsContent" class="stats-content">
          <p>Loading statistics...</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2024 URL Shortener. Made with ❤️</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
